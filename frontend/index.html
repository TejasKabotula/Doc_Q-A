<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI PDF Learning Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            /* Cream & White Theme Palette */
            --bg-cream: #faf8f4ba;
            /* Soft luxurious warm cream background */
            --card-white: #FFFFFF;
            /* Clean pure white for cards */
            --panel-cream: #f3efe6aa;
            /* Secondary cream for sub-boxes */
            --border-cream: #e6dfceb3;
            /* Subtle warm sand border */
            --border-light: #EFEAE0;
            /* Soft divider border */

            --text-primary: #2B2621;
            /* Deep warm espresso/charcoal for crisp readability */
            --text-muted: #756D63;
            /* Warm stone/taupe */
            --text-subtle: #A39B8E;
            /* Soft secondary text */

            --accent-warm: #C07037;
            /* Warm amber/caramel accent */
            --accent-hover: #A85D2A;
            --btn-dark: #2B2621;
            /* Espresso button */
            --btn-dark-hover: #3E3731;

            --success-bg: #ecfdf5e3;
            /* Soft sage */
            --success-border: #A7F3D0;
            --success-text: #065F46;

            --error-bg: #FEF2F2;
            /* Soft rose */
            --error-border: #FECACA;
            --error-text: #991B1B;

            --shadow-sm: 0 1px 3px rgba(43, 38, 33, 0.04);
            --shadow-md: 0 4px 16px rgba(43, 38, 33, 0.05);
            --shadow-lg: 0 10px 28px rgba(43, 38, 33, 0.07);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-cream);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-cream);
            padding: 1.1rem 2.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .logo-group h1 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .logo-group p {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-top: 0.15rem;
        }

        .badge-status {
            background-color: var(--success-bg);
            color: var(--success-text);
            border: 1px solid var(--success-border);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.4rem 0.9rem;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: var(--shadow-sm);
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            background-color: #10B981;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .container {
            display: grid;
            grid-template-columns: 320px 1fr;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            padding: 1.8rem;
            gap: 1.8rem;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
                padding: 1rem;
            }
        }

        /* Sidebar Panel */
        .sidebar-card {
            background-color: var(--card-white);
            border: 1px solid var(--border-cream);
            border-radius: 14px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.3rem;
            height: fit-content;
            box-shadow: var(--shadow-md);
        }

        .sidebar-card h3 {
            font-size: 1.02rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .upload-dropzone {
            border: 2px dashed #D9D2C3;
            background-color: #FAF8F4;
            border-radius: 10px;
            padding: 1.8rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upload-dropzone:hover {
            border-color: var(--accent-warm);
            background-color: #F5EFE4;
        }

        .upload-dropzone input[type="file"] {
            display: none;
        }

        .btn {
            background-color: var(--btn-dark);
            color: #FFFFFF;
            border: none;
            padding: 0.75rem 1.3rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            box-shadow: 0 2px 6px rgba(43, 38, 33, 0.12);
        }

        .btn:hover {
            background-color: var(--btn-dark-hover);
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .btn-warm {
            background-color: var(--accent-warm);
        }

        .btn-warm:hover {
            background-color: var(--accent-hover);
        }

        /* Main Workspace Panel */
        .main-workspace {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .tab-bar {
            display: flex;
            gap: 0.35rem;
            background-color: #ECE5D7;
            border: 1px solid var(--border-cream);
            border-radius: 10px;
            padding: 0.35rem;
            width: fit-content;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 0.55rem 1.4rem;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 7px;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: var(--text-primary);
        }

        .tab-btn.active {
            background-color: var(--card-white);
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
        }

        .tab-content {
            display: none;
            background-color: var(--card-white);
            border: 1px solid var(--border-cream);
            border-radius: 14px;
            padding: 1.8rem;
            flex: 1;
            box-shadow: var(--shadow-md);
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        /* Chat Styles */
        .chat-box {
            display: flex;
            flex-direction: column;
            gap: 1.1rem;
            height: 520px;
            overflow-y: auto;
            padding: 1rem;
            margin-bottom: 1.2rem;
            background-color: #FDFBF8;
            border: 1px solid var(--border-light);
            border-radius: 12px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 82%;
            border-radius: 12px;
            padding: 1rem 1.2rem;
            font-size: 0.94rem;
            line-height: 1.55;
            box-shadow: var(--shadow-sm);
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--btn-dark);
            color: #FFFFFF;
            border-bottom-right-radius: 3px;
        }

        .message.assistant {
            align-self: flex-start;
            background-color: var(--card-white);
            border: 1px solid var(--border-cream);
            color: var(--text-primary);
            border-bottom-left-radius: 3px;
        }

        .context-toggle {
            font-size: 0.8rem;
            color: var(--accent-warm);
            margin-top: 0.6rem;
            cursor: pointer;
            display: inline-block;
            font-weight: 600;
        }

        .context-toggle:hover {
            text-decoration: underline;
        }

        .context-details {
            display: none;
            background: #F8F5EE;
            border: 1px solid var(--border-cream);
            padding: 0.8rem;
            border-radius: 8px;
            margin-top: 0.5rem;
            font-size: 0.78rem;
            color: #4A423B;
            white-space: pre-wrap;
            line-height: 1.45;
        }

        .chat-input-bar {
            display: flex;
            gap: 0.6rem;
        }

        .chat-input-bar input {
            flex: 1;
            background-color: var(--card-white);
            border: 1px solid var(--border-cream);
            border-radius: 8px;
            padding: 0.85rem 1.1rem;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .chat-input-bar input:focus {
            border-color: var(--accent-warm);
            box-shadow: 0 0 0 3px rgba(192, 112, 55, 0.12);
        }

        /* Quiz Styles */
        .quiz-config {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 1.2rem;
            align-items: center;
            background-color: #FAF8F4;
            padding: 1.2rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-cream);
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            background-color: var(--card-white);
            border: 1px solid var(--border-cream);
            border-radius: 7px;
            padding: 0.65rem 0.85rem;
            color: var(--text-primary);
            outline: none;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--accent-warm);
            box-shadow: 0 0 0 3px rgba(192, 112, 55, 0.12);
        }

        .question-card {
            background-color: var(--card-white);
            border: 1px solid var(--border-cream);
            border-radius: 10px;
            padding: 1.4rem;
            margin-bottom: 1.1rem;
            box-shadow: var(--shadow-sm);
        }

        .question-title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 0.9rem;
            color: var(--text-primary);
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            background-color: #FAF8F4;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: all 0.15s ease;
            color: var(--text-primary);
            font-size: 0.92rem;
        }

        .option-item:hover {
            border-color: var(--accent-warm);
            background-color: #F4EFE6;
        }

        .option-item input[type="radio"] {
            accent-color: var(--accent-warm);
            width: 16px;
            height: 16px;
        }

        .quiz-result-score {
            background-color: var(--btn-dark);
            color: #FFFFFF;
            border-radius: 10px;
            padding: 1.3rem;
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 1.3rem;
            font-weight: 700;
            box-shadow: var(--shadow-md);
        }

        .feedback-box {
            margin-top: 0.8rem;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.88rem;
            line-height: 1.5;
        }

        .feedback-correct {
            background-color: var(--success-bg);
            border: 1px solid var(--success-border);
            color: var(--success-text);
        }

        .feedback-incorrect {
            background-color: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(43, 38, 33, 0.2);
            border-radius: 50%;
            border-top-color: var(--text-primary);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo-group">
            <h1>PDF Learning Assistant</h1>
        </div>
        <div class="badge-status">
            <span class="badge-dot"></span>
            <span id="status-text"></span>
        </div>
    </header>

    <div class="container">
        <!-- Sidebar Controls -->
        <aside class="sidebar-card">
            <h3>Knowledge Base</h3>
            <div class="upload-dropzone" onclick="document.getElementById('file-input').click()">
                <div style="font-size: 2rem; margin-bottom: 0.4rem;"></div>
                <div style="font-weight: 600; font-size: 0.92rem; color: var(--text-primary);" id="file-label">Click to
                    select PDF</div>
                <div style="font-size: 0.76rem; color: var(--text-muted); margin-top: 0.25rem;">Supports .pdf documents
                </div>
                <input type="file" id="file-input" accept=".pdf" onchange="handleFileSelect(event)">
            </div>
            <button class="btn" id="upload-btn" onclick="uploadAndIndexPDF()" disabled>
                ⚡ Index Document
            </button>
            <div id="upload-msg" style="font-size: 0.82rem; text-align: center;"></div>
        </aside>

        <!-- Main Workspace -->
        <main class="main-workspace">
            <!-- Tabs Header -->
            <div class="tab-bar">
                <button class="tab-btn active" onclick="switchTab('chat')">Ask Queries</button>
                <button class="tab-btn" onclick="switchTab('quiz')">Quiz</button>
            </div>

            <!-- Tab 1: Chat -->
            <section id="tab-chat" class="tab-content active">
                <div class="chat-box" id="chat-box">
                    <div class="message assistant">
                        Hello! I'm your AI PDF learning assistant. Ask me anything about your uploaded document!
                    </div>
                </div>
                <div class="chat-input-bar">
                    <input type="text" id="query-input" placeholder="Ask a question about the document..."
                        onkeydown="if(event.key==='Enter') sendQuery()">
                    <button class="btn" style="width: auto; padding: 0.85rem 1.6rem;" onclick="sendQuery()"
                        id="send-btn">Ask</button>
                </div>
            </section>

            <!-- Tab 2: Quiz -->
            <section id="tab-quiz" class="tab-content">
                <div class="quiz-config">
                    <div class="form-group">
                        <label>Quiz Topic / Subject</label>
                        <input type="text" id="quiz-topic" value="Main concepts"
                            placeholder="e.g. Machine Learning, Architecture">
                    </div>
                    <div class="form-group">
                        <label>Questions</label>
                        <select id="quiz-count">
                            <option value="3">3 Questions</option>
                            <option value="5" selected>5 Questions</option>
                            <option value="10">10 Questions</option>
                        </select>
                    </div>
                    <div style="margin-top: 1.25rem;">
                        <button class="btn" onclick="generateQuiz()" id="quiz-gen-btn">Generate Quiz</button>
                    </div>
                </div>

                <div id="quiz-container">
                    <div style="text-align: center; color: var(--text-muted); padding: 3rem 1rem;">
                        Give Topic name and then click "Generate Quiz" button . It will Collect the revelent chuks based
                        on
                        Topic Name.
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        let selectedFile = null;
        let currentQuizData = [];

        // Tab Switching
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            if (tab === 'chat') {
                document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
                document.getElementById('tab-chat').classList.add('active');
            } else {
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
                document.getElementById('tab-quiz').classList.add('active');
            }
        }

        // File Selection
        function handleFileSelect(e) {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                document.getElementById('file-label').innerText = selectedFile.name;
                document.getElementById('upload-btn').disabled = false;
            }
        }

        // Upload and Index PDF via FastAPI
        async function uploadAndIndexPDF() {
            if (!selectedFile) return;
            const btn = document.getElementById('upload-btn');
            const msg = document.getElementById('upload-msg');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Indexing...';
            msg.innerHTML = '<span style="color: var(--accent-warm);">Extracting & indexing vectors...</span>';

            const formData = new FormData();
            formData.append("file", selectedFile);

            try {
                const res = await fetch("/api/upload", { method: "POST", body: formData });
                const data = await res.json();
                if (res.ok) {
                    msg.innerHTML = `<span style="color: var(--success-text); font-weight: 600;">✓ Indexed ${data.filename}!</span>`;
                    document.getElementById('status-text').innerText = `Index Active: ${selectedFile.name}`;
                } else {
                    msg.innerHTML = `<span style="color: var(--error-text);">Failed: ${data.detail}</span>`;
                }
            } catch (err) {
                msg.innerHTML = `<span style="color: var(--error-text);">Error uploading: ${err}</span>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '⚡ Index Document';
            }
        }

        // Send Query to RAG Pipeline
        async function sendQuery() {
            const input = document.getElementById('query-input');
            const query = input.value.trim();
            if (!query) return;

            const chatBox = document.getElementById('chat-box');

            // Append User Message
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerText = query;
            chatBox.appendChild(userMsg);
            input.value = '';

            // Assistant placeholder
            const assistMsg = document.createElement('div');
            assistMsg.className = 'message assistant';
            assistMsg.innerHTML = '<span class="spinner"></span> Thinking & retrieving...';
            chatBox.appendChild(assistMsg);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question: query })
                });
                const data = await res.json();
                if (res.ok) {
                    let contextHtml = '';
                    if (data.contexts && data.contexts.length > 0) {
                        contextHtml = `
                            <span class="context-toggle" onclick="toggleContext(this)">🔍 View ${data.contexts.length} Retrieved Chunks ▼</span>
                            <div class="context-details">${data.contexts.map((c, i) => `[Chunk ${i + 1}]:\n${c}`).join('\n\n')}</div>
                        `;
                    }
                    assistMsg.innerHTML = `${data.answer} ${contextHtml}`;
                } else {
                    assistMsg.innerHTML = `<span style="color: var(--error-text);">Error: ${data.detail}</span>`;
                }
            } catch (err) {
                assistMsg.innerHTML = `<span style="color: var(--error-text);">Request error: ${err}</span>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function toggleContext(elem) {
            const details = elem.nextElementSibling;
            if (details.style.display === 'block') {
                details.style.display = 'none';
                elem.innerText = elem.innerText.replace('▲', '▼');
            } else {
                details.style.display = 'block';
                elem.innerText = elem.innerText.replace('▼', '▲');
            }
        }

        // Generate Quiz via FastAPI
        async function generateQuiz() {
            const topic = document.getElementById('quiz-topic').value || "Main concepts";
            const count = parseInt(document.getElementById('quiz-count').value);
            const container = document.getElementById('quiz-container');
            const btn = document.getElementById('quiz-gen-btn');

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Generating...';
            container.innerHTML = `<div style="text-align: center; padding: 2rem; color: var(--text-muted);"><span class="spinner"></span> Generating quiz on "${topic}"...</div>`;

            try {
                const res = await fetch("/api/quiz", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ topic: topic, num_questions: count })
                });
                const data = await res.json();
                if (res.ok && data.questions && data.questions.length > 0) {
                    currentQuizData = data.questions;
                    renderQuizForm(data.questions);
                } else {
                    container.innerHTML = `<div style="color: var(--error-text); text-align: center;">Failed to generate quiz: ${data.detail || 'No questions parsed.'}</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div style="color: var(--error-text); text-align: center;">Error: ${err}</div>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Generate Quiz';
            }
        }

        function renderQuizForm(questions) {
            const container = document.getElementById('quiz-container');
            let html = '';

            questions.forEach(q => {
                html += `
                    <div class="question-card" id="q-card-${q.id}">
                        <div class="question-title">Q${q.id}: ${q.question}</div>
                        ${['A', 'B', 'C', 'D'].map(opt => `
                            <label class="option-item">
                                <input type="radio" name="question_${q.id}" value="${opt}">
                                <span><strong>${opt}:</strong> ${q.options[opt] || ''}</span>
                            </label>
                        `).join('')}
                        <div class="feedback-box" id="feedback-${q.id}" style="display: none;"></div>
                    </div>
                `;
            });

            html += `<button class="btn" style="margin-top: 1.2rem;" onclick="submitQuiz()">Submit Answers</button>`;
            container.innerHTML = html;
        }

        function submitQuiz() {
            let correct = 0;
            const total = currentQuizData.length;

            currentQuizData.forEach(q => {
                const selected = document.querySelector(`input[name="question_${q.id}"]:checked`);
                const userChoice = selected ? selected.value : null;
                const feedback = document.getElementById(`feedback-${q.id}`);
                feedback.style.display = 'block';

                if (userChoice === q.correct_answer) {
                    correct++;
                    feedback.className = 'feedback-box feedback-correct';
                    feedback.innerHTML = `✓ <strong>Correct!</strong> ${q.explanation}`;
                } else {
                    feedback.className = 'feedback-box feedback-incorrect';
                    feedback.innerHTML = `✗ <strong>Incorrect.</strong> Correct answer is <strong>${q.correct_answer}</strong>.<br>${q.explanation}`;
                }
            });

            const scorePercent = Math.round((correct / total) * 100);
            const scoreCard = `
                <div class="quiz-result-score">
                    🎯 Final Score: ${correct} / ${total} (${scorePercent}%)
                </div>
            `;
            const container = document.getElementById('quiz-container');
            container.insertAdjacentHTML('afterbegin', scoreCard);
            window.scrollTo({ top: container.offsetTop, behavior: 'smooth' });
        }
    </script>
</body>

</html>
